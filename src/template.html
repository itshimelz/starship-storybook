<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ship 42 · ঘরে ফেরা — a code-drawn storybook</title>
<style>
  html,body{margin:0;height:100%;background:#1b1922;overflow:hidden;font-family:Hind,"Noto Sans Bengali","Nirmala UI",Vrinda,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,177.78vh);height:auto;aspect-ratio:16/9;display:block}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:rgba(27,25,34,.35)}
  #ui button{font:600 28px Hind,"Noto Sans Bengali",sans-serif;padding:14px 34px;border-radius:40px;border:3px solid #2a2730;background:#f5eddc;color:#2a2730;cursor:pointer;box-shadow:4px 5px 0 #2a2730}
  #ui small{color:#f5eddc;opacity:.8;font-size:15px}
  body.capture{display:block;background:none}
  body.capture canvas{width:1920px;height:1080px}
  body.capture #ui{display:none}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><button id="play">▶ দেখুন / Play</button><small>Ship 42 · ঘরে ফেরা — everything is drawn by code · click canvas to pause</small></div>
<audio id="au" preload="auto"></audio>
<script>
"use strict";
/* ============================================================
   Ship 42 · ঘরে ফেরা — procedural storybook animation
   Everything is drawn with Canvas2D + JS. No images, no libs.
   ?frame=N   → render exactly frame N (12 fps, 0..1439) for capture
   ============================================================ */
const AUDIO_SRC = "__AUDIO__";
const SUBS = __SUBS__;           // [{a,b,text}] seconds
const W = 1920, H = 1080, FPS = 12, DUR = 120, TOTAL = FPS * DUR;
const SCENES = [0, 25, 55, 85, 110, 120];
const TITLES = ["মহাকাশের নিস্তব্ধতা আর ঘরে ফেরার টান", "আগুনের বুক চিরে ফিরে আসা", "মেঘ ফুঁড়ে মাটির কাছাকাছি", "শ্বাসরুদ্ধকর সেই আলিঙ্গন", "নতুন এক ভোরের গল্প"];
const FONT = 'Hind, "Noto Sans Bengali", "Nirmala UI", Vrinda, sans-serif';

const cv = document.getElementById("c");
const mainX = cv.getContext("2d");
const off = document.createElement("canvas"); off.width = W; off.height = H;
const offX = off.getContext("2d");
let X = mainX;          // current drawing context
let BOIL = 0;           // line "boil" seed: re-jitter every 2 frames

/* ---------------- math / randomness ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(){let h=2166136261>>>0;for(let i=0;i<arguments.length;i++){h^=(arguments[i]*1000|0);h=Math.imul(h,16777619)>>>0;h^=h>>>13}return h>>>0}
const R = s => mulberry32(s);
const D = Math.PI/180;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>0.5-Math.cos(Math.PI*clamp(x))/2;
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const easeIn=x=>Math.pow(clamp(x),3);
const backOut=x=>{x=clamp(x);const c1=1.25,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const bump=(t,a,b)=>Math.sin(Math.PI*seg(t,a,b));
function hex2rgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(c1,c2,t){const a=hex2rgb(c1),b=hex2rgb(c2);t=clamp(t);return "#"+a.map((v,i)=>Math.round(lerp(v,b[i],t)).toString(16).padStart(2,"0")).join("")}
function rgba(hex,a){const c=hex2rgb(hex);return `rgba(${c[0]},${c[1]},${c[2]},${a})`}

/* ---------------- palette ---------------- */
const C = {
  ink:"#2a2730", paper:"#f5eddc", cream:"#fbf3e2",
  steel:"#cfd2d9", steel2:"#a9aebb", steelHi:"#f6f3ec", shield:"#2f2d38", flap:"#3c3a46", engine:"#45434f",
  eye:"#fffdf6", blush:"#f2949c",
  ocean:"#3d8fc9", ocean2:"#2f74b5", land:"#9fbf7d", land2:"#c9a45c", cloud:"#fffaf0",
  space1:"#1d1b38", space2:"#3b3166", star:"#f7dc8c",
  orange:"#ff8a3d", pink:"#ff5fa2", purple:"#9b5de5", gold:"#ffcf5a", mustard:"#f2bf45", teal:"#2f9e8f",
  sea:"#3aa0b4", sea2:"#2b8299", sand:"#f0d49a", scrub:"#b5b26a", coral:"#e76f51", lilac:"#a35bd6"
};

/* ---------------- textures (generated once, seeded) ---------------- */
function makeStrokeTex(col, count, seed, size=360, ang=-58){
  const c=document.createElement("canvas");c.width=c.height=size;const g=c.getContext("2d");const r=R(seed);
  g.lineCap="round";
  for(let i=0;i<count;i++){
    const x=r()*size,y=r()*size,L=3+r()*15,a=(ang+(r()-0.5)*34)*D,al=0.03+r()*0.13,lw=0.5+r()*1.9;
    g.strokeStyle=col.replace("A",al.toFixed(3));g.lineWidth=lw;
    for(const ox of [-size,0,size])for(const oy of [-size,0,size]){
      const xx=x+ox,yy=y+oy; if(xx<-20||xx>size+20||yy<-20||yy>size+20)continue;
      g.beginPath();g.moveTo(xx,yy);g.lineTo(xx+Math.cos(a)*L,yy+Math.sin(a)*L);g.stroke();
    }
  }
  for(let i=0;i<count*0.6;i++){const x=r()*size,y=r()*size;g.fillStyle=col.replace("A",(0.04+r()*0.12).toFixed(3));g.fillRect(x,y,0.6+r()*1.6,0.6+r()*1.6)}
  return c;
}
const TEX_L = makeStrokeTex("rgba(255,255,250,A)", 2600, 11);
const TEX_D = makeStrokeTex("rgba(45,25,60,A)", 2200, 23, 360, -50);
const PAT_L = mainX.createPattern(TEX_L,"repeat");
const PAT_D = mainX.createPattern(TEX_D,"repeat");
const PAT_L2 = offX.createPattern(TEX_L,"repeat");
const PAT_D2 = offX.createPattern(TEX_D,"repeat");
const GRAIN = (()=>{const c=document.createElement("canvas");c.width=W/2;c.height=H/2;const g=c.getContext("2d");const id=g.createImageData(c.width,c.height);const r=R(99);
  for(let i=0;i<id.data.length;i+=4){const v=128+(r()+r()+r()-1.5)*70;id.data[i]=v;id.data[i+1]=v*0.98;id.data[i+2]=v*0.94;id.data[i+3]=255}
  g.putImageData(id,0,0);g.lineCap="round";
  for(let i=0;i<900;i++){const x=r()*c.width,y=r()*c.height,a=r()*Math.PI,L=4+r()*18;g.strokeStyle=r()<0.5?"rgba(255,255,255,.25)":"rgba(0,0,0,.18)";g.lineWidth=0.6;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a)*L*0.5+r()*4,y+Math.sin(a)*L*0.5+r()*4,x+Math.cos(a)*L,y+Math.sin(a)*L);g.stroke()}
  return c})();

/* ---------------- wobbly hand-drawn path engine ---------------- */
function curScale(){const m=X.getTransform();return Math.hypot(m.a,m.b)||1}
function densify(pts,closed,step){
  const out=[],n=pts.length,lim=closed?n:n-1;
  for(let i=0;i<lim;i++){const a=pts[i],b=pts[(i+1)%n];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const k=Math.max(1,Math.ceil(L/step));
    for(let j=0;j<k;j++)out.push([a[0]+(b[0]-a[0])*j/k,a[1]+(b[1]-a[1])*j/k])}
  if(!closed)out.push(pts[n-1]);return out;
}
function wpath(pts,{closed=true,amp=2.2,seed=1}={}){
  const s=curScale(),step=13/s,a=amp/s;
  const d=densify(pts,closed,step),N=d.length,K=4,nl=Math.max(2,Math.ceil(N/K));
  const r=R(hsh(seed,BOIL));const nx=[],ny=[];for(let i=0;i<nl+1;i++){nx.push(r()*2-1);ny.push(r()*2-1)}
  const q=new Array(N);
  for(let i=0;i<N;i++){const f=i/K;let i0=Math.floor(f),i1=i0+1;if(closed){i0%=nl;i1%=nl}else{i0=Math.min(i0,nl);i1=Math.min(i1,nl)}const u=f-Math.floor(f),w=u*u*(3-2*u);
    q[i]=[d[i][0]+a*(nx[i0]*(1-w)+nx[i1]*w)+a*0.3*(r()-0.5), d[i][1]+a*(ny[i0]*(1-w)+ny[i1]*w)+a*0.3*(r()-0.5)]}
  const p=new Path2D();
  if(N<3){p.moveTo(q[0][0],q[0][1]);for(let i=1;i<N;i++)p.lineTo(q[i][0],q[i][1]);return p}
  if(closed){const m0=[(q[N-1][0]+q[0][0])/2,(q[N-1][1]+q[0][1])/2];p.moveTo(m0[0],m0[1]);
    for(let i=0;i<N;i++){const b=q[(i+1)%N];p.quadraticCurveTo(q[i][0],q[i][1],(q[i][0]+b[0])/2,(q[i][1]+b[1])/2)}p.closePath()}
  else{p.moveTo(q[0][0],q[0][1]);for(let i=1;i<N-1;i++){const b=q[i+1];p.quadraticCurveTo(q[i][0],q[i][1],(q[i][0]+b[0])/2,(q[i][1]+b[1])/2)}p.lineTo(q[N-1][0],q[N-1][1])}
  return p;
}
function pats(){return X===mainX?[PAT_L,PAT_D]:[PAT_L2,PAT_D2]}
/** fill + crayon texture + edge shading + double wobbly ink outline */
function paint(pts,fill,o={}){
  const {seed=1,amp=2.2,lw=3.2,ink=C.ink,tex=1,shade=0.14,outline=true,alpha=1,inkAlpha=1}=o;
  const s=curScale();const p=wpath(pts,{seed,amp});
  X.save();X.globalAlpha*=alpha;
  if(fill){X.fillStyle=fill;X.fill(p);
    if(tex>0){X.save();X.clip(p);
      if(shade>0){X.strokeStyle=`rgba(60,28,64,${shade})`;X.lineWidth=30/s;X.stroke(p);X.lineWidth=11/s;X.strokeStyle=`rgba(60,28,64,${shade*0.9})`;X.stroke(p)}
      const [PL,PD]=pats();const rr=R(seed*13+7);const m=new DOMMatrix().translate(rr()*360,rr()*360).scale(1/s);
      PL.setTransform(m);X.globalAlpha=alpha*0.7*tex;X.fillStyle=PL;X.fill(p);
      PD.setTransform(m.translate(41,97));X.globalAlpha=alpha*0.6*tex;X.fillStyle=PD;X.fill(p);
      X.restore()}}
  if(outline&&lw>0){X.lineJoin="round";X.lineCap="round";X.strokeStyle=ink;X.globalAlpha=alpha*inkAlpha;X.lineWidth=lw/s;X.stroke(p);
    const p2=wpath(pts,{seed:seed+77,amp:amp*1.2});X.globalAlpha=alpha*inkAlpha*0.4;X.lineWidth=lw*0.5/s;X.stroke(p2)}
  X.restore();return p;
}
function line(pts,o={}){const {seed=1,amp=1.6,lw=3,color=C.ink,alpha=1}=o;const s=curScale();const p=wpath(pts,{closed:false,seed,amp});
  X.save();X.globalAlpha*=alpha;X.strokeStyle=color;X.lineWidth=lw/s;X.lineCap="round";X.lineJoin="round";X.stroke(p);X.restore();return p}
/* shapes */
function ell(cx,cy,rx,ry,n=28,rot=0){const o=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const x=Math.cos(a)*rx,y=Math.sin(a)*ry;o.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)])}return o}
function rect(x,y,w,h){return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]]}
function blob(cx,cy,r,bumps,seed,rough=0.2){const rr=R(seed);const ph=rr()*6;const o=[];const n=bumps*6;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const k=1+rough*Math.abs(Math.sin(a*bumps/2+ph))+0.05*rr();o.push([cx+Math.cos(a)*r*k,cy+Math.sin(a)*r*k*0.92])}return o}
function cloudPts(x,y,w,h,bumps,seed){const rr=R(seed);const o=[[x+w,y],[x,y]];let cx=x;const bw=w/bumps;
  for(let b=0;b<bumps;b++){const hh=h*(0.55+0.45*Math.sin(Math.PI*(b+0.5)/bumps))*(0.8+rr()*0.35);const c0=x+bw*(b+0.5);
    for(let i=1;i<10;i++){const a=Math.PI-i/10*Math.PI;o.push([c0+Math.cos(a)*bw*0.62,y-Math.sin(a)*hh])}}
  return o}
function sparkle(x,y,r,col,alpha=1){X.save();X.globalAlpha*=alpha;X.fillStyle=col;X.beginPath();const d=r*1.7;X.moveTo(x,y-d);X.quadraticCurveTo(x,y,x+d,y);X.quadraticCurveTo(x,y,x,y+d);X.quadraticCurveTo(x,y,x-d,y);X.quadraticCurveTo(x,y,x,y-d);X.fill();X.restore()}
function glow(x,y,r,col,a,sy=1){X.save();X.translate(x,y);X.scale(1,sy);const g=X.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,rgba(col,a));g.addColorStop(0.45,rgba(col,a*0.45));g.addColorStop(1,rgba(col,0));X.fillStyle=g;X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.fill();X.restore()}
function vgrad(y0,y1,stops){const g=X.createLinearGradient(0,y0,0,y1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}

/* ============================================================
   STARSHIP  (local space: vertical, nose up, origin = middle)
   tip y=-300, body y∈[-170,250], radius 50, engines to y=284
   heat shield (black tiles) on local +x side
   ============================================================ */
const OGIVE=(()=>{const L=[],Rr=[];for(let i=0;i<=12;i++){const u=i/12;const y=-170-130*u;const x=50*Math.pow(Math.cos(u*Math.PI/2),0.72);L.push([-x,y]);Rr.push([x,y])}return {L,R:Rr}})();
const BODY=[[-50,250],...OGIVE.L,...OGIVE.R.slice(0,-1).reverse(),[50,250]];
const SHIELD=[[16,250],[16,-170],[12,-228],[6,-270],[1,-296],...OGIVE.R.slice(1,-1).reverse(),[50,250]];
// note: OGIVE.R goes from base (i=0) up to tip; SHIELD walks inner edge up then outer edge down

function shipPose(o){X.translate(o.x,o.y);X.rotate((o.rot||0)*D);X.scale(o.s,o.s*(o.yaw===undefined?1:o.yaw))}
function flapShape(hx,hy,side,ang,kind,seed,heat){
  X.save();X.translate(hx,hy);X.rotate(-side*ang*D);
  const base=kind==="fwd"?[[0,-34],[0,38],[-38,24],[-33,-16]]:[[0,-64],[0,62],[-66,52],[-58,-36]];
  const pts=base.map(([x,y])=>[x*(-side),y]);
  paint(pts,mix(C.flap,"#ff7a3a",heat*0.55),{seed,lw:3});
  // little hinge stripe
  line([[pts[0][0]*0.2+pts[3][0]*0.8*0.15, -10],[pts[3][0]*0.6, (kind==="fwd"?0:-6)]],{seed:seed+3,lw:1.5,color:"rgba(255,255,255,0.25)"});
  X.restore();
}
function flamePts(y0,len,w,seed){const r=R(hsh(seed,BOIL));const L=len*(0.86+r()*0.28);const n=12;const left=[],right=[];
  for(let i=0;i<=n;i++){const t=i/n;const wig=w*0.13*Math.sin(t*9+BOIL*1.9+seed);const hw=w*(0.62+1.25*t)*Math.pow(1-t,1.05)+(i<n?wig:0);
    left.push([-hw+wig*0.6,y0+t*L]);right.unshift([hw+wig*0.6,y0+t*L])}
  return [...left,...right]}
function shipFlame(o){
  const f=o.flame||0;if(f<=0)return;const L=(o.flameLen||260)*f, sd=o.seed||100;
  const blue=o.flameStyle!=="vac";
  X.save();X.globalCompositeOperation="lighter";
  glow(0,290+L*0.25,90+L*0.35,blue?"#ffb347":"#ff9a3c",0.55*f,1.4);X.restore();
  X.save();
  for(const ex of [-26,0,26]){X.save();X.translate(ex,0);
    paint(flamePts(282,L,15+6*f,sd+ex),blue?"#ffc247":"#ff9e45",{seed:sd+ex+1,lw:2.2,ink:"#c2551f",inkAlpha:0.7,tex:0.6,shade:0.05,amp:1.6});
    paint(flamePts(282,L*0.68,9+4*f,sd+ex+5),blue?"#7cc4ff":"#ffd27a",{seed:sd+ex+6,lw:0,outline:false,tex:0.5,shade:0,amp:1.2});
    paint(flamePts(282,L*0.32,5+2*f,sd+ex+9),"#f3fbff",{seed:sd+ex+10,lw:0,outline:false,tex:0.2,shade:0,amp:1});
    X.restore()}
  X.restore();
}
function ship(o){
  const sd=o.seed||100, heat=o.heat||0, ff=o.ff||[0,0], af=o.af||[0,0];
  X.save();shipPose(o);
  shipFlame(o);
  [-26,0,26].forEach((ex,i)=>{paint([[ex-9,238],[ex+9,238],[ex+15,284],[ex-15,284]],C.engine,{seed:sd+i,lw:2.6});
    if((o.flame||0)>0){X.save();X.globalAlpha=clamp(o.flame);X.fillStyle="#ffd98a";X.beginPath();X.ellipse(ex,283,12,3.5,0,0,Math.PI*2);X.fill();X.restore()}});
  flapShape(-50,182,-1,af[0],"aft",sd+10,heat);flapShape(50,182,1,af[1],"aft",sd+11,heat);
  flapShape(-48,-192,-1,ff[0],"fwd",sd+12,heat);flapShape(48,-192,1,ff[1],"fwd",sd+13,heat);
  // steel body
  const bp=paint(BODY,C.steel,{seed:sd+20,shade:0.18,lw:3.4});
  X.save();X.clip(bp);
  paint(rect(-38,-280,13,540),C.steelHi,{seed:sd+21,outline:false,alpha:0.75,tex:0.5,shade:0});
  paint(rect(-22,-250,5,500),C.steelHi,{seed:sd+22,outline:false,alpha:0.45,tex:0.3,shade:0});
  paint(rect(-54,-260,9,520),C.steel2,{seed:sd+23,outline:false,alpha:0.7,tex:0.5,shade:0});
  for(const y of [-135,-95,85,130,175,215])line([[-50,y],[16,y]],{seed:sd+y,lw:1.4,alpha:0.32,amp:0.8});
  if(o.scorch){const g=X.createLinearGradient(0,60,0,260);g.addColorStop(0,"rgba(120,70,40,0)");g.addColorStop(1,`rgba(90,50,30,${0.45*o.scorch})`);X.fillStyle=g;X.fillRect(-60,40,120,230);
    const g2=X.createLinearGradient(0,-300,0,-120);g2.addColorStop(0,`rgba(150,90,60,${0.25*o.scorch})`);g2.addColorStop(1,"rgba(150,90,60,0)");X.fillStyle=g2;X.fillRect(-60,-310,120,200)}
  X.restore();
  // heat shield
  const sp=paint(SHIELD,mix(C.shield,"#5a2a3a",heat*0.5),{seed:sd+30,shade:0.1,lw:3.2});
  X.save();X.clip(sp);
  X.strokeStyle=heat>0.05?`rgba(255,${Math.round(200-60*heat)},120,${0.16+0.5*heat})`:"rgba(255,255,255,0.11)";X.lineWidth=1.3/curScale();X.beginPath();
  for(let y=-300,row=0;y<260;y+=12,row++){X.moveTo(10,y);X.lineTo(60,y);for(let x=16+(row%2)*6;x<56;x+=12){X.moveTo(x,y);X.lineTo(x,y+12)}}X.stroke();
  if(heat>0){X.globalCompositeOperation="lighter";const g=X.createLinearGradient(16,0,58,0);g.addColorStop(0,`rgba(160,60,200,${0.25*heat})`);g.addColorStop(0.55,`rgba(255,90,140,${0.55*heat})`);g.addColorStop(1,`rgba(255,170,60,${0.85*heat})`);X.fillStyle=g;X.fillRect(10,-310,60,580)}
  X.restore();
  // payload "pez" door on the steel side
  const dop=o.door||0;
  if(dop>0){paint(rect(-46,10,52,38),"#1d1b26",{seed:sd+40,lw:2.4,tex:0.4});
    X.save();X.translate(0,dop*36);paint(rect(-46,10,52,38),mix(C.steel,"#9aa0ad",0.3),{seed:sd+41,lw:2.4,alpha:1-dop*0.15});X.restore()}
  else{paint(rect(-46,10,52,38),mix(C.steel,"#9aa0ad",0.25),{seed:sd+41,lw:2.4,tex:0.6});line([[-40,29],[0,29]],{seed:sd+42,lw:1.3,alpha:0.35})}
  // little face, drawn upright in screen space
  if(o.face!==false)shipFace(o);
  X.restore();
}
function shipFace(o){
  const m=X.getTransform();const p=m.transformPoint(new DOMPoint(-17,-40));const s=Math.hypot(m.a,m.b);const ya=clamp(Math.hypot(m.c,m.d)/s,0.12,1);
  const sd=(o.seed||100)+60;
  const fs=s*1.45;X.save();X.setTransform(fs*ya,0,0,fs,p.x,p.y);
  const blink=o.blink||0, look=o.look||[0,0], mood=o.mood||"calm";
  for(const side of [-1,1]){const ex=side*13;

  // cloud layers passing upward (we're descending through them)
  const clouds=(front)=>{for(let i=0;i<8;i++){const q=R(5000+i*3+(front?1:0));const sp=320+q()*240;const y=1250+q()*500-t*sp*1.25;if(y<-300||y>1500)continue;const x=-300+q()*2300;
      if(front&&i%2)continue;paint(blob(x,y,180+q()*200,7,5100+i+(front?50:0),0.22),"#fffaf0",{seed:5200+i+(front?50:0),lw:2.6,alpha:front?0.72:0.95,shade:0.08})}};
  clouds(false);
  const ff=fp>0&&fp<1?[-40*Math.sin(Math.PI*fp),-40*Math.sin(Math.PI*fp)]:(fp>=1?[25,25]:[10+10*Math.sin(t*1.4),10-10*Math.sin(t*1.4)]);
  const af=fp>=1?[20,20]:[-2+8*Math.sin(t*1.1),-2-8*Math.sin(t*1.1)];
  ship({x:sx,y:sy,rot,s:S,yaw:-1,seed:100,flame:ign*(0.95+0.08*Math.sin(BOIL*2.7))*(1+0.3*bump(t,6.4,8)),flameLen:300,ff,af,
    blink:bump(t,3,3.3)+bump(t,15,15.3)+bump(t,22,22.3)+bump(t,27,27.3),look:fp>=1?[0.5,1]:[-0.6,0.8],mood:t>6&&t<10?"wide":"calm"});
  if(t>6&&t<10.8){const a=bump(t,6,10.8);for(let i=0;i<10;i++){const q=R(5400+i);const ang=q()*Math.PI*2;const rr=200+q()*120;line([[sx+Math.cos(ang)*rr,sy+Math.sin(ang)*rr],[sx+Math.cos(ang)*(rr+50),sy+Math.sin(ang)*(rr+50)]],{seed:5410+i,lw:3,color:C.ink,alpha:a*0.5})}}
  clouds(true);
  title(2,t);
}

/* ============================================================
   SCENE 4+5 · 1:25–2:00  Mechazilla catch, steam, pull back
   world t: 0..25 = scene 4, 25..35 = scene 5
   ============================================================ */
const TOWER={x0:600,x1:770,top:40,base:930,pivotY:392};
function catchShip(t){
  const ap=ease(seg(t,0,13.4));
  let x=lerp(1480,1062,ap), y=lerp(250,512,ease(seg(t,0,14.6)));
  const dip=t>15.4?10*Math.exp(-(t-15.4)*1.2)*Math.sin((t-15.4)*5.5):0;
  y+=dip+(t>15.4?6*seg(t,15.4,16.2):0);
  const tilt=6*Math.sin(Math.PI*seg(t,0,13.4))*(1-ap*0.5);
  return {x,y,rot:180-tilt,s:1.05};
}
function arm(pivX,pivY,ang,len,col,seed,front){
  X.save();X.translate(pivX,pivY);X.rotate(ang*D);
  paint(rect(0,-16,len,32),col,{seed,lw:3,amp:1.6,shade:0.12});
  X.save();X.strokeStyle=front?"rgba(255,255,255,0.28)":"rgba(255,255,255,0.18)";X.lineWidth=1.6/curScale();X.beginPath();for(let x=0;x<len-20;x+=26){X.moveTo(x,-14);X.lineTo(x+13,14);X.lineTo(x+26,-14)}X.stroke();X.restore();
  paint(rect(len-200,14,60,13),C.mustard,{seed:seed+5,lw:2.2,amp:1});
  X.restore();
}
function smokePuff(x,y,r,seed,a,col="#efe7da"){paint(blob(x,y,r,6,seed,0.25),col,{seed:seed+1,lw:2.2,alpha:a,inkAlpha:0.55,shade:0.1})}
function catchWorld(t){
  const dawn=ease(seg(t,23,33));
  X.fillStyle=vgrad(-400,H+200,[[0,mix("#8fc3e6","#6e7fc4",dawn)],[0.55,mix("#e8eef0","#f6b8a8",dawn)],[1,mix("#ffe1b3","#ffd27a",dawn)]]);X.fillRect(-2000,-1200,6000,3600);
  // world camera
  const z=lerp(1,0.62,ease(seg(t,25,34.6)));const cyw=lerp(540,470,ease(seg(t,25,34.6)));const cxw=lerp(960,930,ease(seg(t,25,34.6)));
  X.save();X.translate(960,540);X.scale(z,z);X.translate(-cxw,-cyw);
  // sun + rays (stronger at dawn)
  glow(1560,250,380,"#fff0b0",0.75);paint(ell(1560,250,62,62,24),mix("#ffd66b","#ffb347",dawn),{seed:600,lw:3});
  if(dawn>0){X.save();X.globalAlpha=0.35*dawn;for(let i=0;i<14;i++){const a=i/14*Math.PI*2+t*0.05;line([[1560+Math.cos(a)*90,250+Math.sin(a)*90],[1560+Math.cos(a)*(150+30*(i%2)),250+Math.sin(a)*(150+30*(i%2))]],{seed:610+i,lw:4,color:"#ffcf5a"})}X.restore()}
  for(let i=0;i<5;i++){const q=R(620+i);paint(cloudPts(-500+i*640+q()*120+t*4,170+q()*230,240+q()*160,50+q()*30,4,630+i),"#fffaf0",{seed:640+i,lw:2.2,alpha:0.85,shade:0.05})}
  // far sea + dunes + ground
  X.fillStyle=vgrad(760,840,[[0,"#7cc3cf"],[1,C.sea]]);X.fillRect(-1400,760,4800,90);
  for(let i=0;i<10;i++)line([[-1200+i*480+((t*12)%60),790+(i%3)*14],[-1170+i*480+((t*12)%60),784+(i%3)*14],[-1140+i*480+((t*12)%60),790+(i%3)*14]],{seed:650+i,lw:2,color:"#e8fbff",alpha:0.7});
  paint([[-1400,840],[3400,830],[3400,2000],[-1400,2000]],C.sand,{seed:660,lw:2.6,shade:0.06});
  paint([[-1400,905],[3400,900],[3400,2000],[-1400,2000]],"#cfc2a8",{seed:661,lw:2.6,shade:0.08});
  for(let i=0;i<4;i++)paint(rect(-700+i*30-(i%2)*0,820-(i%2)*30,22,90+(i%2)*30),"#ede8de",{seed:670+i,lw:2,amp:1});
  // tower
  const T=TOWER;paint(rect(T.x0,T.top,T.x1-T.x0,T.base-T.top),"#565364",{seed:700,lw:3.4,shade:0.2});
  X.save();X.strokeStyle="rgba(255,255,255,0.22)";X.lineWidth=2/curScale();X.beginPath();for(let y=T.top;y<T.base;y+=56){X.moveTo(T.x0,y);X.lineTo(T.x1,y+56);X.moveTo(T.x1,y);X.lineTo(T.x0,y+56);X.moveTo(T.x0,y);X.lineTo(T.x1,y)}X.stroke();X.restore();
  line([[T.x0+85,T.top],[T.x0+85,T.top-70]],{seed:701,lw:3});sparkle(T.x0+85,T.top-74,7,"#ff6b5b",0.5+0.5*Math.cos(BOIL));
  paint(rect(T.x1-12,T.pivotY-46,54,92),"#6e6b7c",{seed:702,lw:3,shade:0.15});
  // launch mount at the tower foot
  paint(rect(T.x1+120,T.base-110,260,110),"#8d8a96",{seed:703,lw:3,shade:0.12});paint(ell(T.x1+250,T.base-110,112,16,20),"#6f6c79",{seed:704,lw:2.4});
  // arms (far one behind ship)
  const cl=ease(seg(t,13,15.4));const flex=t>15.4?4*Math.exp(-(t-15.4)*1.2)*Math.sin((t-15.4)*5.5):0;
  const farA=lerp(-22,-1.2,cl)+flex*0.3, nearA=lerp(-11,1.2,cl)+flex*0.3;
  arm(T.x1+30,T.pivotY-8,farA,560,"#4d4a5a",710,false);
  const sp=catchShip(t);
  const flameOn=1-seg(t,15.8,16.3);
  // ground smoke: puffs born under the flame
  const puffs=(front)=>{for(let i=0;i<70;i++){const tb=i*0.3;if(tb>16)break;if(t<tb)continue;const age=t-tb;const q=R(800+i);if((q()<0.45)!==front)continue;
      const born=catchShip(tb);const dir=q()<0.5?-1:1;const life=8+q()*4;if(age>life+2)continue;
      const x=born.x+dir*(60+age*(70+q()*50)),y=T.base-30-age*(10+q()*14)-q()*40;const r=28+age*(11+q()*8);
      const a=clamp(age/0.6)*(1-seg(age,life*0.45,life+1.5))*0.9;if(a<=0.01)continue;smokePuff(x,y,r,820+i,a,i%5===0?"#ffd9b0":"#efe7da")}};
  puffs(false);
  if(flameOn>0){X.save();X.globalCompositeOperation="lighter";glow(sp.x,T.base-60,260,"#ffb347",0.6*flameOn,0.5);X.restore()}
  const happy=t>16.6;
  ship({...sp,yaw:-1,seed:100,flame:flameOn*(0.95+0.08*Math.sin(BOIL*2.3)),flameLen:lerp(330,250,seg(t,10,15.8)),ff:[25,25],af:[22,22],scorch:clamp(0.6+t/30),
    blink:happy?0:bump(t,4,4.3)+bump(t,10,10.3)+bump(t,14,14.25),look:t<13?[-0.9,0.4]:[-1,0],mood:happy?"happy":(t>12.8&&t<16.6?"wide":"calm")});
  puffs(true);
  arm(T.x1+30,T.pivotY+8,nearA,600,"#6a6778",730,true);
  // the embrace: little sparkles + hearts of joy
  if(t>15.6&&t<22){for(let i=0;i<10;i++){const q=R(900+i);const a=bump(t,15.6+q()*0.8,18+q()*3);const ang=-Math.PI*q();const rr=120+(t-15.6)*30+q()*40;sparkle(sp.x+Math.cos(ang)*rr*1.6,sp.y-130+Math.sin(ang)*rr*0.9,8+q()*8,[C.gold,C.pink,"#ffffff"][i%3],a)}}
  // steam rising from scorched steel (after catch)
  const st=seg(t,17,19);
  if(st>0){for(let i=0;i<28;i++){const q=R(950+i);const per=3.6+q()*2;const ph=((t+q()*per)%per)/per;const ly=-250+q()*480;const side=q()<0.5?-1:1;
      const bx=sp.x+side*(46+q()*10),by=sp.y+ly*sp.s;const x=bx+side*ph*(30+q()*60)+Math.sin(ph*6+i)*12,y=by-ph*(140+q()*120);const r=10+ph*(34+q()*30);
      paint(blob(x,y,r,5,960+i,0.3),"#ffffff",{seed:970+i,lw:1.8,alpha:st*(1-ph)*0.8*(ph<0.12?ph/0.12:1),inkAlpha:0.35,tex:0.4,shade:0.03})}}
  X.restore();
}
function scene4(t){catchWorld(t);title(3,t)}
function scene5(t){catchWorld(25+t);title(4,t);
  const a=seg(t,8.6,10);if(a>0){X.save();X.globalAlpha=a*0.0;X.restore()}}

/* ============================================================
   RENDER
   ============================================================ */
const SCENE_FN=[scene1,scene2,scene3,scene4,scene5];
function drawScene(i,tGlobal,ctx){const prev=X;X=ctx;X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.globalCompositeOperation="source-over";SCENE_FN[i](tGlobal-SCENES[i]);X=prev}
function renderFrame(f){
  f=Math.max(0,Math.min(TOTAL-1,f|0));BOIL=Math.floor(f/2);
  const t=f/FPS;X=mainX;X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.globalCompositeOperation="source-over";
  let i=0;while(i<4&&t>=SCENES[i+1])i++;
  drawScene(i,t,mainX);
  // crossfades (1.2s) at 25, 55, 85 ; 85→110 is one continuous world
  for(const b of [25,55,85]){const k=b===85?0:1;if(!k)continue;const s=seg(t,b-0.6,b+0.6);
    if(t>=b-0.6&&t<b){drawScene(SCENES.indexOf(b),t,offX);mainX.save();mainX.globalAlpha=ease(s);mainX.drawImage(off,0,0);mainX.restore()}
    if(t>=b&&t<b+0.6){drawScene(SCENES.indexOf(b)-1,t,offX);mainX.save();mainX.globalAlpha=1-ease(s);mainX.drawImage(off,0,0);mainX.restore()}}
  // S3→S4 is a crossfade too
  { const b=85,s=seg(t,b-0.8,b+0.8);
    if(t>=b-0.8&&t<b){drawScene(3,t,offX);mainX.save();mainX.globalAlpha=ease(s);mainX.drawImage(off,0,0);mainX.restore()}
    if(t>=b&&t<b+0.8){drawScene(2,t,offX);mainX.save();mainX.globalAlpha=1-ease(s);mainX.drawImage(off,0,0);mainX.restore()}}
  X=mainX;X.setTransform(1,0,0,1,0,0);
  finish();
  subtitles(t);
  // gentle fade from black at the very start, and to paper at the very end
  const fin=1-seg(t,0,1.0), fout=seg(t,119.3,120);
  if(fin>0){X.fillStyle=`rgba(20,18,30,${fin})`;X.fillRect(0,0,W,H)}
  if(fout>0){X.fillStyle=rgba(C.paper,fout*0.9);X.fillRect(0,0,W,H)}
}
window.renderFrame=renderFrame;

/* ---------------- modes ---------------- */
const params=new URLSearchParams(location.search);
const au=document.getElementById("au");
window.__ready=(async()=>{try{await document.fonts.load(`600 34px ${FONT}`,"অআ");await document.fonts.load(`500 38px ${FONT}`,"অআ")}catch(e){} return true})();
if(params.has("frame")||params.has("capture")){
  document.body.classList.add("capture");
  window.__ready.then(()=>{if(params.has("frame"))renderFrame(+params.get("frame"));window.__rendered=true});
}else{
  if(AUDIO_SRC&&!AUDIO_SRC.startsWith("__"))au.src=AUDIO_SRC;
  window.__ready.then(()=>renderFrame(Math.round(3*FPS)));
  let playing=false,startClock=0,lastF=-1;
  const now=()=>au.src?au.currentTime:(performance.now()-startClock)/1000;
  function loop(){if(!playing)return;const t=now();const f=Math.floor(t*FPS);if(f!==lastF){lastF=f;renderFrame(f)}if(t>=DUR||au.ended){playing=false;document.getElementById("ui").style.display="flex";return}requestAnimationFrame(loop)}
  document.getElementById("play").onclick=()=>{document.getElementById("ui").style.display="none";if(au.ended||now()>=DUR){au.currentTime=0;startClock=performance.now()}
    if(au.src)au.play();else startClock=performance.now()-(lastF>0?lastF/FPS*1000:0);playing=true;loop()};
  cv.onclick=()=>{if(!playing)return;playing=false;if(au.src)au.pause();document.getElementById("ui").style.display="flex"};
}
</script>
